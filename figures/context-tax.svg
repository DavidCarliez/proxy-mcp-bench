<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d"><title id="t">Context tax of tool definitions</title><desc id="d">Horizontal bars of the tool-definition size each MCP adds to every model request.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b16"/><stop offset="0.55" stop-color="#0b1222"/><stop offset="1" stop-color="#10192b"/></linearGradient><pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#7dd3fc" stroke-opacity="0.045"/></pattern></defs><rect width="1280" height="420" rx="22" fill="url(#bg)"/><rect width="1280" height="420" rx="22" fill="url(#grid)"/><text x="48.0" y="62.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#e2e8f0" fill-opacity="1" text-anchor="start">The context tax: tool definitions ride along on every turn</text><text x="48.0" y="92.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" fill-opacity="1" text-anchor="start">size of tools/list in tokens (≈ bytes / 4) and number of tools</text><text x="48.0" y="172.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="400" fill="#e2e8f0" fill-opacity="1" text-anchor="start">Burp · official MCP</text><rect x="360.0" y="154.0" width="56.9" height="28.0" rx="6" fill="#b45309" fill-opacity="0.9"/><text x="428.9" y="174.0" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="400" fill="#e2e8f0" fill-opacity="1" text-anchor="start">2,136 tokens · 27 tools</text><text x="48.0" y="228.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="400" fill="#e2e8f0" fill-opacity="1" text-anchor="start">Burp · b