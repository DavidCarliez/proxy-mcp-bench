<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="t d"><title id="t">Proxy memory as history grows</title><desc id="d">Resident memory of Burp and Caido while holding 20k to 100k requests.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b16"/><stop offset="0.55" stop-color="#0b1222"/><stop offset="1" stop-color="#10192b"/></linearGradient><pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#7dd3fc" stroke-opacity="0.045"/></pattern></defs><rect width="1280" height="520" rx="22" fill="url(#bg)"/><rect width="1280" height="520" rx="22" fill="url(#grid)"/><text x="48.0" y="62.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#e2e8f0" fill-opacity="1" text-anchor="start">Memory held by the proxy itself</text><text x="48.0" y="92.0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" fill-opacity="1" text-anchor="start">resident set size after each 20k load (same corpus) · Burp&#x27;s JVM grows its heap in steps</text><line x1="110.0" y1="430.0" x2="1010.0" y2="430.0" stroke="#1e293b" stroke-width="1" stroke-opacity="1"/><text x="100.0" y="434.0" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400" fill="#64748b" fill-opacity="1" text-anchor="end">0.0 GB</text><line x1="110.0" y1="368.6" x2="1010.0" y2="368.6" stroke="#1e293b" stroke-width="1" stroke-opacity="1"/><text x="100.0" y="372.6" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400" fill="#64748b" fill-opacity="1" text-anchor="end">1.0 GB</text><line x1="110.0" y1="307.1" x2="1010.0" y2="307.1" stroke="#1e293b" stroke-width="1" stroke-opacity="1"/><text x="100.0" y="311.1" font-